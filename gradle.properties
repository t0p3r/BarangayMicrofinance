# Gradle Daemon JVM options: Max Heap Size set to 4GB to prevent OutOfMemoryError: Java heap space
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m

# Kotlin Daemon JVM options
kotlin.daemon.jvmargs=-Xmx2048m

# AndroidX configuration
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enable parallel execution and build caching for improved build performance
org.gradle.parallel=true
org.gradle.caching=true
